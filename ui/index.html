<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8" />
	<meta
		http-equiv="Content-Security-Policy"
		content="default-src 'self'; style-src 'self'; img-src 'self'"
	/>
	<title>Kairo</title>
	<link rel="stylesheet" href="style.css" />
</head>
<body>
	<img class="brand" src="logo.svg" alt="Kairo logo" draggable="false" />

	<div class="menu-backdrop" id="menu-backdrop" hidden></div>

	<aside class="sidebar">
		<button type="button" class="sidebar__brand">
			<img
				class="sidebar__brand-logo"
				src="logo.svg"
				alt=""
				draggable="false"
			/>
			<span class="sidebar__brand-name">Kairo</span>
		</button>

		<button type="button" class="sidebar__new-chat">
			<svg
				xmlns="http://www.w3.org/2000/svg"
				viewBox="0 0 24 24"
				fill="none"
				stroke="currentColor"
				stroke-width="2"
				stroke-linecap="round"
				stroke-linejoin="round"
				aria-hidden="true"
			>
				<path d="M5 12h14"/><path d="M12 5v14"/>
			</svg>
			<span>New Chat</span>
		</button>

		<nav class="sidebar__chatnav" aria-label="Conversations">
			<ul class="chat-list" id="chat-list"></ul>
		</nav>

		<button type="button" class="sidebar__settings">
			<svg
				xmlns="http://www.w3.org/2000/svg"
				viewBox="0 0 24 24"
				fill="none"
				stroke="currentColor"
				stroke-width="2"
				stroke-linecap="round"
				stroke-linejoin="round"
				aria-hidden="true"
			>
				<path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/>
				<circle cx="12" cy="12" r="3"/>
			</svg>
			<span>Settings</span>
		</button>
	</aside>

	<section class="screen screen--welcome" aria-label="Welcome">
		<button type="button" class="btn welcome__cta">
			Get Started
			<span class="btn-arrow" aria-hidden="true">&rarr;</span>
		</button>
	</section>

	<section class="screen screen--providers" aria-label="Choose a provider">
		<div class="providers">
			<h1 class="providers__title">Choose a provider</h1>
			<p class="providers__subtitle">Connect an AI provider to continue.</p>

			<div class="providers__grid" role="group" aria-label="Available providers">
				<button type="button" class="provider-card" data-provider="groq" aria-pressed="false">
					<span class="provider-card__logo provider-card__logo--groq" aria-hidden="true">
						<svg fill="currentColor" fill-rule="evenodd" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><title>Groq</title><path d="M12.036 2c-3.853-.035-7 3-7.036 6.781-.035 3.782 3.055 6.872 6.908 6.907h2.42v-2.566h-2.292c-2.407.028-4.38-1.866-4.408-4.23-.029-2.362 1.901-4.298 4.308-4.326h.1c2.407 0 4.358 1.915 4.365 4.278v6.305c0 2.342-1.944 4.25-4.323 4.279a4.375 4.375 0 01-3.033-1.252l-1.851 1.818A7 7 0 0012.029 22h.092c3.803-.056 6.858-3.083 6.879-6.816v-6.5C18.907 4.963 15.817 2 12.036 2z"></path></svg>
					</span>
					<span class="provider-card__name">Groq</span>
					<span class="provider-card__desc">Fast LLM inference API.</span>
				</button>

				<button type="button" class="provider-card" data-provider="openrouter" aria-pressed="false">
					<span class="provider-card__logo provider-card__logo--openrouter" aria-hidden="true">
						<svg fill="currentColor" fill-rule="evenodd" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><title>OpenRouter</title><path d="M18.654 3.87a5.087 5.087 0 110 10.174L23.7 19.09c.64.641.187 1.737-.72 1.737H8.48a8.479 8.479 0 010-16.958h10.175zM8.479 7.26a5.087 5.087 0 100 10.176 5.087 5.087 0 000-10.175z"></path></svg>
					</span>
					<span class="provider-card__name">OpenRouter</span>
					<span class="provider-card__desc">One API for hundreds of models.</span>
				</button>

				<button type="button" class="provider-card" data-provider="ollama" aria-pressed="false">
					<span class="provider-card__logo provider-card__logo--ollama" aria-hidden="true">
						<svg fill="currentColor" fill-rule="evenodd" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><title>Ollama</title><path d="M16.361 10.26a.894.894 0 0 0-.558.47l-.072.148.001.207c0 .193.004.217.059.353.076.193.152.312.291.448.24.238.51.3.872.205a.86.86 0 0 0 .517-.436.752.752 0 0 0 .08-.498c-.064-.453-.33-.782-.724-.897a1.06 1.06 0 0 0-.466 0zm-9.203.005c-.305.096-.533.32-.65.639a1.187 1.187 0 0 0-.06.52c.057.309.31.59.598.667.362.095.632.033.872-.205.14-.136.215-.255.291-.448.055-.136.059-.16.059-.353l.001-.207-.072-.148a.894.894 0 0 0-.565-.472 1.02 1.02 0 0 0-.474.007Zm4.184 2c-.131.071-.223.25-.195.383.031.143.157.288.353.407.105.063.112.072.117.136.004.038-.01.146-.029.243-.02.094-.036.194-.036.222.002.074.07.195.143.253.064.052.076.054.255.059.164.005.198.001.264-.03.169-.082.212-.234.15-.525-.052-.243-.042-.28.087-.355.137-.08.281-.219.324-.314a.365.365 0 0 0-.175-.48.394.394 0 0 0-.181-.033c-.126 0-.207.03-.355.124l-.085.053-.053-.032c-.219-.13-.259-.145-.391-.143a.396.396 0 0 0-.193.032zm.39-2.195c-.373.036-.475.05-.654.086-.291.06-.68.195-.951.328-.94.46-1.589 1.226-1.787 2.114-.04.176-.045.234-.045.53 0 .294.005.357.043.524.264 1.16 1.332 2.017 2.714 2.173.3.033 1.596.033 1.896 0 1.11-.125 2.064-.727 2.493-1.571.114-.226.169-.372.22-.602.039-.167.044-.23.044-.523 0-.297-.005-.355-.045-.531-.288-1.29-1.539-2.304-3.072-2.497a6.873 6.873 0 0 0-.855-.031zm.645.937a3.283 3.283 0 0 1 1.44.514c.223.148.537.458.671.662.166.251.26.508.303.82.02.143.01.251-.043.482-.08.345-.332.705-.672.957a3.115 3.115 0 0 1-.689.348c-.382.122-.632.144-1.525.138-.582-.006-.686-.01-.853-.042-.57-.107-1.022-.334-1.35-.68-.264-.28-.385-.535-.45-.946-.03-.192.025-.509.137-.776.136-.326.488-.73.836-.963.403-.269.934-.46 1.422-.512.187-.02.586-.02.773-.002zm-5.503-11a1.653 1.653 0 0 0-.683.298C5.617.74 5.173 1.666 4.985 2.819c-.07.436-.119 1.04-.119 1.503 0 .544.064 1.24.155 1.721.02.107.031.202.023.208a8.12 8.12 0 0 1-.187.152 5.324 5.324 0 0 0-.949 1.02 5.49 5.49 0 0 0-.94 5 6.805 0 0 0-.097.726c0 .036-.007.066-.015.066a.96.96 0 0 1-.149-.078A4.857 4.857 0 0 0 12 3.03c-.832 0-1.687.243-2.456.698a.958.958 0 0 1-.148.078c-.008 0-.015-.03-.015-.066a6.71 6.71 0 0 0-.097-.725C8.997 1.392 8.337.319 7.46.048a2.096 2.096 0 0 0-.585-.041Zm.293 1.402c.248.197.523.759.682 1.388.03.113.06.244.069.292.007.047.026.152.041.233.067.365.098.76.102 1.24l.002.475-.12.175-.118.178h-.278c-.324 0-.646.041-.954.124l-.238.06c-.033.007-.038-.003-.057-.144a8.438 8.438 0 0 1 .016-2.323c.124-.788.413-1.501.696-1.711.067-.05.079-.049.157.013zm9.825-.012c.17.126.358.46.498.888.28.854.36 2.028.212 3.145-.019.14-.024.151-.057.144l-.238-.06a3.693 3.693 0 0 0-.954-.124h-.278l-.119-.178-.119-.175.002-.474c.004-.669.066-1.19.214-1.772.157-.623.434-1.185.68-1.382.078-.062.09-.063.159-.012z"/></svg>
					</span>
					<span class="provider-card__name">Ollama</span>
					<span class="provider-card__desc">Run local models on your machine.</span>
				</button>

				<button type="button" class="provider-card" data-provider="gemini" aria-pressed="false">
					<span class="provider-card__logo provider-card__logo--gemini" aria-hidden="true">
						<svg fill="currentColor" fill-rule="evenodd" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><title>Gemini</title><path d="M11.04 19.32Q12 21.51 12 24q0-2.49.93-4.68.96-2.19 2.58-3.81t3.81-2.55Q21.51 12 24 12q-2.49 0-4.68-.93a12.3 12.3 0 0 1-3.81-2.58 12.3 12.3 0 0 1-2.58-3.81Q12 2.49 12 0q0 2.49-.96 4.68-.93 2.19-2.55 3.81a12.3 12.3 0 0 1-3.81 2.58Q2.49 12 0 12q2.49 0 4.68.96 2.19.93 3.81 2.55t2.55 3.81"/></svg>
					</span>
					<span class="provider-card__name">Gemini</span>
					<span class="provider-card__desc">Google's family of AI models.</span>
				</button>
			</div>

			<div class="providers__actions">
				<button type="button" class="btn providers__continue" disabled>
					Continue
					<span class="btn-arrow" aria-hidden="true">&rarr;</span>
				</button>
			</div>
		</div>
	</section>

	<section class="screen screen--apikey" aria-label="Connect provider">
		<div class="connect">
			<div class="provider-hero">
				<span class="provider-hero__logo" aria-hidden="true"></span>
				<span class="provider-hero__name"></span>
			</div>

			<label class="connect__label" for="api-key">API key</label>
			<input
				class="connect__input"
				id="api-key"
				name="api-key"
				type="password"
				autocomplete="off"
				spellcheck="false"
				placeholder="Paste your API key"
			/>

			<button type="button" class="btn connect__apply" hidden>
				Apply
			</button>

			<p class="connect__error" role="alert" hidden></p>
		</div>
	</section>

	<section class="screen screen--dashboard" aria-label="Dashboard">
		<main class="dashboard">
			<div class="dashboard__hero">
				<img
					class="dashboard__logo"
					src="logo.svg"
					alt="Kairo logo"
					draggable="false"
				/>
				<p class="dashboard__tagline">Kairo Cares About Your Privacy</p>
			</div>
		</main>
	</section>

	<section class="screen screen--settings" aria-label="Settings">
		<main class="settings">
			<h1 class="settings__title">Settings</h1>

			<h2 class="settings__heading">Connected providers</h2>
			<ul class="connected"></ul>

			<h2 class="settings__heading">Connect a new provider</h2>
			<div class="providers__grid settings__grid" role="group" aria-label="Available providers"></div>

			<div class="settings__connect" hidden>
				<label class="connect__label" for="settings-api-key">API key</label>
				<input
					class="connect__input"
					id="settings-api-key"
					name="settings-api-key"
					type="password"
					autocomplete="off"
					spellcheck="false"
					placeholder="Paste your API key"
				/>

				<button type="button" class="btn connect__apply settings-apply" hidden>
					Apply
				</button>

				<p class="connect__error settings-error" role="alert" hidden></p>
			</div>
		</main>
	</section>

	<section class="screen screen--chat" aria-label="Chat">
		<main class="chat">
			<div class="chat__messages" aria-live="polite">
				<div class="chat__column">
					<div class="chat__blank">No messages yet. Ask anything.</div>
				</div>
			</div>

			<div class="composer-wrap">
				<div class="menu" id="provider-menu" role="menu" hidden></div>

				<div class="menu menu--model" id="model-menu" role="menu" hidden>
					<div class="menu__search">
						<input
							class="menu__search-input"
							id="model-search"
							type="text"
							placeholder="Search models"
							autocomplete="off"
							spellcheck="false"
						/>
					</div>
					<div class="menu__list" id="model-menu-list"></div>
				</div>

				<form class="composer" id="chat-composer" autocomplete="off">
					<textarea
						class="composer__textarea"
						id="chat-message"
						placeholder="Ask anything…"
						rows="1"
					></textarea>

					<div class="composer__toolbar">
						<div class="composer__tools">
							<button
								type="button"
								class="pill"
								id="provider-pill"
								aria-haspopup="menu"
								aria-expanded="false"
								aria-label="Selected provider"
							>
								<span class="pill__icon" aria-hidden="true"></span>
								<span class="pill__label">Provider</span>
							</button>

							<button
								type="button"
								class="pill"
								id="model-pill"
								aria-haspopup="menu"
								aria-expanded="false"
								aria-label="Selected model"
							>
								<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"/><path d="m3.3 7 8.7 5 8.7-5"/><path d="M12 22V12"/></svg>
								<span class="pill__label" id="model-pill-label">Model</span>
							</button>
						</div>

						<button type="submit" class="send-btn" id="chat-send" aria-label="Send message" disabled>
							<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12 7-7 7 7"/><path d="M12 19V5"/></svg>
						</button>
					</div>

					<p class="chat__error" role="alert" hidden></p>
				</form>
			</div>
		</main>
	</section>

	<script src="app.js"></script>
</body>
</html>
